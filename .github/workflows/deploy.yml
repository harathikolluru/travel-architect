# Student capstone deploy — from kamalraj2000/capstone-deploy-template.
#
# Every push to main: builds your Docker image IN Azure Container Registry
# (no Docker needed in the runner, no registry password anywhere), then points
# your Container App at the new image.
#
# Setup (once): add five repo VARIABLES (not secrets) in
# Settings → Secrets and variables → Actions → Variables:
#   AZURE_CLIENT_ID        — 2c6973aa-b98b-4fce-ba9c-57d2e96a1c97
#   AZURE_TENANT_ID        — d75a3b31-b6ea-4bc1-9a3c-f760e543f24e
#   AZURE_SUBSCRIPTION_ID  — da17b3c4-4654-42b9-8719-5be9df6afa9f
#   ACR_NAME               — acrstudentssezuvhh3ijtfm
#   STUDENT                — travelarchitect
name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (in ACR)
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}/web:${{ github.sha }} .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --resource-group rg-students-platform \
            --name ca-${{ vars.STUDENT }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}/web:${{ github.sha }}
